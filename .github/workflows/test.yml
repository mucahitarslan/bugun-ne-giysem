name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Chromium ve sistem bağımlılıklarını kur
        run: npx playwright install --with-deps chromium
      - name: Testleri çalıştır
        run: npm test
